name: Qodana
permissions: read-all
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, master, qodana, default, qodana-2]

jobs:
  qodana:
    runs-on: self-hosted # Targets your macOS runner
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Run Qodana using Docker Desktop's built-in macOS SSH bridge
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          use-nightly: true
          # Bind mount the special macOS Docker Desktop SSH bridge
          args: |
            --image,registry.jetbrains.team/p/sa/containers/qodana-jvm:2025.3-nightly,
            -e,SSH_AUTH_SOCK=/tmp/ssh_agent.sock,
            -e,GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no,
            -v,${{ env.SSH_AUTH_SOCK }}:/tmp/ssh_agent.sock
          upload-result: true
          pr-mode: 'true'
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
name: Qodana
permissions: read-all
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - master
      - qodana
      - default

jobs:
  qodana:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.2
        with:
          upload-result: true
          pr-mode: false
          use-caches: true
          cache-default-branch-only: false #333
          args: |
            --linter,qodana-jvm,
            --within-docker,false,
            --property=idea.project.build.system=maven
        env:
          QODANA_TOKEN:  ${{ secrets.QODANA_TOKEN }}

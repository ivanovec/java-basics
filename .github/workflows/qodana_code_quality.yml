name: Qodana
permissions: read-all
on:
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JetBrains/qodana-action
          ref: next
          path: qa
          fetch-depth: 0
      - name: 'Qodana Scan (qodana-action@v2026.2.2 on qodana-action sources)'
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --project-dir,${{ github.workspace }}/qa,--config,.github/qodana.yaml,--log-level,debug
          pr-mode: false
          upload-result: false
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

name: Qodana
permissions: read-all
on:
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JetBrains/qodana-action
          ref: next
          path: qa
          fetch-depth: 0
      - name: Use JDK 17 instead of 11
        run: |
          sed -i 's/^projectJDK: "11"/projectJDK: "17"/' qa/.github/qodana.yaml
          grep -n projectJDK qa/.github/qodana.yaml
      - name: 'Qodana Scan (qodana-action@next on qodana-action sources)'
        uses: JetBrains/qodana-action@next
        with:
          args: --project-dir,${{ github.workspace }}/qa,--config,.github/qodana.yaml,--log-level,debug
          pr-mode: false
          upload-result: false
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

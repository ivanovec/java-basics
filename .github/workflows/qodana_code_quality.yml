name: Qodana
permissions: read-all
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - master
      - qodana
      - default
      - qodana-2

jobs:
  qodana:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GRADLE_OPTS: "-Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
            ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          use-nightly: true
          args: --image,registry.jetbrains.team/p/sa/containers/qodana-jvm:2025.3-nightly,-v,/private/tmp/com.apple.launchd.IvhaOanPZV/Listeners:/tmp/ssh_agent.sock
          upload-result: true
          pr-mode: 'true'
        #        with:
#          primary-cache-key: qodana-2024.3-${{ github.event.repository.default_branch }}
#          use-caches: ${{ (github.ref_name == github.event.repository.default_branch) && 'true' || 'false' }}
        env:
          QODANA_TOKEN:  ${{ secrets.QODANA_TOKEN }}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock

name: Chatter attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - qodana

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: qodana/chatter-action@3c9a893a08bb5623b63480e0a38d599cd6e3641b

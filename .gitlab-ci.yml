# Test configuration for QD-13302 - HTTPS URL parsing in quick-fixes
include:
  - component: $CI_SERVER_FQDN/qodana/qodana/qodana-gitlab-ci@v2025.3
    inputs:
      upload-result: true
      artifact-name: Qodana report
      push-fixes: branch
      args: |
        --baseline,qodana.sarif.json
        --fail-threshold,0
        --image,jetbrains/qodana-jvm:2025.3
        --cleanup

qodana:
  stage: test
  variables:
    QODANA_TOKEN: $qodana_token
    QODANA_GITLAB_TOKEN: $GITLAB_TOKEN
  before_script:
    - echo "qodana_token first 30 chars - ${qodana_token:0:30}"
    - echo "qodana_token length - ${#qodana_token}"
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'merge_request_event')
    - if: ($CI_COMMIT_MESSAGE =~ /runqodana/)
  allow_failure: true

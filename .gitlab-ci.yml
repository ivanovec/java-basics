# Test configuration for QD-13302 on local GitLab
include:
  - component: gitlab.com/qodana/qodana/qodana-gitlab-ci@v2025.3
    inputs:
      upload-result: false
      push-fixes: branch
      args: --baseline,qodana.sarif.json,--fail-threshold,0,--image,jetbrains/qodana-jvm:2025.3,--cleanup

qodana:
  stage: test
  variables:
    QODANA_TOKEN: $qodana_token
    QODANA_GITLAB_TOKEN: $GITLAB_TOKEN
  before_script:
    - echo "=== Checking remote.origin.url ==="
    - git config --get remote.origin.url
    - echo "=== End check ==="
  rules:
    - if: ($CI_PIPELINE_SOURCE == 'merge_request_event')
    - if: ($CI_PIPELINE_SOURCE == 'push')
  allow_failure: true
